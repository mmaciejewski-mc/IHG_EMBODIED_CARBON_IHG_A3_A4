<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IHG Holiday Inn Express King Guest Room - Embodied Carbon Analysis - Wireframe</title>
<style>
  :root {
    --surface-0: #f5f4f0;
    --surface-1: #ffffff;
    --border: #e0ded6;
    --border-accent: #185fa5;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
  }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--surface-0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 980px;
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface-1);
  }
  .header {
    padding: 22px 24px;
    background: #003E32;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header img {
    width: 40px;
    height: auto;
    flex: 0 0 auto;
  }
  .header .label {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin: 0 0 6px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 6px;
    color: #ffffff;
  }
  .header .sub {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    margin: 0;
  }
  .tabbar {
    display: flex;
    overflow-x: auto;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface-0);
  }
  .tabbar button {
    flex: 0 0 auto;
    padding: 12px 18px;
    font-size: 13px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text-secondary);
    font-family: inherit;
  }
  .tabbar button.active {
    color: var(--text-primary);
    border-bottom: 2px solid var(--border-accent);
  }
  .panel {
    padding: 24px;
    min-height: 260px;
  }
  .panel .tabindex {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .panel .tabname {
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 10px;
    color: var(--text-primary);
  }
  .panel .tabdesc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin: 0 0 14px;
  }
  .panel h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin: 16px 0 6px;
  }
  .panel h3:first-of-type {
    margin-top: 0;
  }
  .panel ul {
    margin: 0 0 4px;
    padding-left: 18px;
  }
  .panel li {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .panel .flag {
    display: inline-block;
    font-size: 11px;
    color: #854f0b;
    background: #faeeda;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 4px;
  }
  .sd-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .sd-stat {
    background: var(--surface-0);
    border: 1px solid var(--border);
    border-top: 3px solid var(--sd-accent, #003E32);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .sd-stat .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .sd-stat .label {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  .sd-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .sd-controls input, .sd-controls select {
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface-1);
  }
  .sd-controls input {
    flex: 1 1 220px;
  }
  .sd-table-wrap {
    overflow-x: auto;
    border: 0.5px solid var(--border);
    border-radius: 8px;
  }
  table.sd-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  table.sd-table th {
    text-align: left;
    background: var(--surface-0);
    color: var(--text-muted);
    font-weight: 500;
    padding: 8px 10px;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  table.sd-table td {
    padding: 7px 10px;
    border-top: 0.5px solid var(--border);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  table.sd-table td.wrap {
    white-space: normal;
    min-width: 160px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-active { background: #e5f3ec; color: #1a6b45; }
  .badge-prev { background: #f0eee8; color: #6b6558; }
  .badge-none { background: #f0eee8; color: #948d80; }
  .badge-data-ok { background: #e5f3ec; color: #1a6b45; }
  .badge-data-progress { background: #faeeda; color: #854f0b; }
  .badge-data-none { background: #f4e6e6; color: #9c3b3b; }
  .sd-count {
    font-size: 12px;
    color: var(--text-muted);
    margin: 8px 0 0;
  }
  .sd-table-scroll {
    max-height: 480px;
    overflow-y: auto;
  }
  .sd-footnote {
    font-size: 12px;
    color: var(--text-muted);
    margin: 10px 0 0;
    line-height: 1.6;
    font-style: italic;
  }
  .results-cards {
    display: flex;
    gap: 16px;
    margin: 4px 0 20px;
    flex-wrap: wrap;
  }
  .result-card {
    flex: 1 1 260px;
    border-radius: 14px;
    padding: 20px;
    border: 2px solid var(--border);
  }
  .result-card.best { border-color: #003E32; }
  .result-card.baseline { border-color: #B5602B; }
  .result-card .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 8px;
    text-align: center;
  }
  .result-card.best .label { color: #003E32; }
  .result-card.baseline .label { color: #B5602B; }
  .result-card .value {
    font-size: 40px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
    text-align: center;
  }
  .result-card .unit {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 14px;
    text-align: center;
  }
  .result-card .stackbar {
    display: flex;
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .result-card .stackbar .a3 { background: #006F62; }
  .result-card .stackbar .a4 { background: #98B6E4; }
  .result-card .splitrow {
    display: flex;
    justify-content: space-between;
    text-align: center;
  }
  .result-card .splitrow > div { flex: 1; }
  .result-card .splitrow .num {
    font-size: 20px;
    font-weight: 700;
  }
  .result-card .splitrow .num.a3 { color: #006F62; }
  .result-card .splitrow .num.a4 { color: #98B6E4; }
  .result-card .splitrow .lbl {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .reduction-badge {
    display: inline-block;
    background: #003E32;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .legend-row {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin: 4px 0 16px;
    flex-wrap: wrap;
  }
  .legend-row .swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .cat-row {
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
    cursor: pointer;
  }
  .cat-row-main {
    display: grid;
    grid-template-columns: 22px 1fr 160px 80px 60px 16px;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .cat-row .rank {
    width: 22px; height: 22px;
    border-radius: 999px;
    background: #eef2f6;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .cat-row .name { color: var(--text-primary); font-weight: 500; }
  .cat-stack-track {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface-0);
  }
  .cat-stack-track .a3 { background: #006F62; }
  .cat-stack-track .a4 { background: #98B6E4; }
  .cat-value { text-align: right; color: var(--text-secondary); }
  .cat-pct { text-align: right; color: var(--text-muted); font-size: 12px; }
  .cat-chevron {
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    transition: transform 0.15s;
  }
  .cat-row.expanded .cat-chevron { transform: rotate(90deg); }
  .cat-detail {
    display: none;
    margin-top: 10px;
    padding-left: 32px;
  }
  .cat-row.expanded .cat-detail { display: block; }
  .sku-block {
    margin-bottom: 12px;
  }
  .sku-block .sku-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  table.opt-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.opt-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    padding: 4px 8px;
  }
  table.opt-table td {
    padding: 4px 8px;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .opt-badge {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 600;
  }
  .opt-badge.best { background: #e5f3ec; color: #1a6b45; }
  .opt-badge.baseline { background: #fbeeee; color: #9c3b3b; }
  .opt-badge.other { background: #f0eee8; color: #6b6558; }
  .opt-badge.only { background: #eef2f6; color: #185fa5; }
  .opt-badge.excluded { background: #fdeee6; color: #b5602b; }
  .opt-badge.nodata { background: #f4f4f4; color: #999; }
  .floorplan-box {
    text-align: center;
    padding: 20px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    margin-top: 16px;
  }
  .floorplan-box img {
    max-width: 100%;
    border-radius: 6px;
  }
  .floorplan-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
    font-style: italic;
  }
  .footer-note {
    max-width: 980px;
    margin: 16px auto 0;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>

      <h3>Why this approach, rather than EPDs</h3>
      <ul>
        <li>Mindclick measures embodied carbon at the factory (manufacturing) and distribution stages. This does not capture the raw material extraction stage.</li>
        <li>Extraction is excluded because Environmental Product Declarations (EPDs) do not universally separate the extraction phase from manufacturing and distribution &mdash; there is no consistent, isolated extraction figure to draw from across vendors today.</li>

        <li>This rate is then multiplied by the quantity of that product specified for one guest room to get the room-level manufacturing contribution.</li>
        <li><strong>Unit conversions:</strong> where a product's specified quantity unit doesn't match the unit the factory reports production in, a documented conversion factor is applied. The one currently in use: <strong>Paint</strong> (specified in square feet, reported by the factory in kilograms) is converted using an industry-standard estimate of ~350 sq ft of coverage per gallon and ~4.54 kg per gallon of paint, giving approximately 0.013 kg of paint per sq ft.</li>

        <li>Factories with no submitted footprint show as <span class="badge badge-data-none">No Data</span> or <span class="badge badge-data-none">Not Rated</span> rather than a blank.</li>
        <li>Program status per factory: <span class="badge badge-active">Active</span> / <span class="badge badge-prev">Historical</span> / <span class="badge badge-none">Not Affiliated</span>.</li>
        <li>"Total units" reflects that facility's total production volume across all products manufactured there, not just this specific item.</li>
        <li>Non-production sites (e.g. a vendor's corporate headquarters, which has no manufacturing output) are excluded from factory-level data, since they do not reflect actual production.</li>
      </ul>
    `
  }
];

const bar = document.getElementById('tabbar');
const panel = document.getElementById('panel');

function badgeForStatus(s) {
  if (s === 'Active') return '<span class="badge badge-active">Active</span>';
  if (s === 'Historical') return '<span class="badge badge-prev">Historical</span>';
  return '<span class="badge badge-none">Not Affiliated</span>';
}

function badgeForFootprint(s) {
  const ok = ['Footprint Completed', 'Footprint + Reduction Targets Set', 'Footprint + Reductions Achieved'];
  const progress = ['Footprint is in process', 'Footprint has been requested', 'No data has been requested'];
  if (ok.includes(s)) return '<span class="badge badge-data-ok">' + s + '</span>';
  if (progress.includes(s)) return '<span class="badge badge-data-progress">' + s + '</span>';
  return '<span class="badge badge-data-none">' + s + '</span>';
}

function fmtNum(v) {
  if (v === '-' || v === '' || v === undefined) return '<span style="color:var(--text-muted)">&mdash;</span>';
  const n = Number(v);
  if (isNaN(n)) return v;
  return n.toLocaleString(undefined, {maximumFractionDigits: 1});
}

function fmtYear(v) {
  if (v === '-' || v === '' || v === undefined) return '<span style="color:var(--text-muted)">&mdash;</span>';
  const n = Number(v);
  if (isNaN(n)) return v;
  return String(Math.round(n));
}

      '</select>' +
      '<select id="sd-status-filter">' +
        '<option value="">All program status</option>' +
        '<option value="Active">Active</option>' +
        '<option value="Historical">Historical</option>' +
        '<option value="Not Affiliated">Not Affiliated</option>' +

    '<table class="sd-table"><thead><tr>' +
      '<th>Category</th><th>Vendor</th><th>Program status</th><th>Facility</th><th>Location</th><th>Footprint status</th><th>Reporting year</th><th>Emissions (kg)</th><th>Total units (factory)</th>' +

  panel.innerHTML =
    '<p class="tabindex">Tab 6 of 6</p>' +

  function renderRows() {

      if (statusFilter && r.MSAP_AFFILIATED !== statusFilter) return false;
      if (q) {
        const hay = (displayCat(r.CATEGORY) + ' ' + r.VENDOR_NAME + ' ' + r.FACILITY_NAME).toLowerCase();

      }

    const tbody = document.getElementById('sd-tbody');

function toNum(v) {
  if (v === undefined || v === null || v === '' || v === '-') return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

// The raw exported data still says "Softgoods" (that's the literal Snowflake
// category name) -- this renames it for display only, wherever a raw
// category string is shown to the user. Underlying data/filtering logic is
// untouched so nothing else in the app breaks.
function displayCat(c) {
  return c === 'Softgoods' ? 'Seating' : c;
}

// "Best"/"Baseline" should reflect lowest/highest TOTAL embodied carbon for
// the room (A3 + A4 combined) -- not just the A3 manufacturing rate. A vendor
// with a low manufacturing rate can still be the worse overall choice once
// shipping distance is factored in.
function combinedTotal(r) {
  const a3 = toNum(r.A3_MANUFACTURING_KG_CO2E) || 0;
  const a4 = toNum(r.A4_DISTRIBUTION_KG_CO2E) || 0;
  return a3 + a4;
}

function renderPriorityCategoriesTab(tabIndex) {
  const rows = A3_A4_DATA;

  function isExcludedRow(r) {
    return A4_EXCLUDED_OUTLIERS.has(r.SKU_NUMBER + '|' + r.VENDOR_NAME);
  }
  function combinedTotal(r) {
    const a3 = toNum(r.A3_MANUFACTURING_KG_CO2E) || 0;
    const a4 = toNum(r.A4_DISTRIBUTION_KG_CO2E) || 0;
    return a3 + a4;
  }

  // Facility-level detail, keyed by SKU+vendor using the dedicated SKU-level
  // export -- this is the real per-product facility list (not a category-wide
  // approximation), so it's accurate even for vendors like Kohler that use
  // different facility subsets for different products within the same category
  const facilityLookup = {};
  SKU_FACILITY_DATA.forEach(r => {
    const key = r.SKU_NUMBER + '|' + r.VENDOR_NAME;
    if (!facilityLookup[key]) facilityLookup[key] = [];
    facilityLookup[key].push(r);
  });

  const bySku = {};
  rows.forEach(r => { if (!bySku[r.SKU_NUMBER]) bySku[r.SKU_NUMBER] = []; bySku[r.SKU_NUMBER].push(r); });

  // Roll raw SPEC_CATEGORY values up into the curated priority buckets from the call
  function toPriorityBucket(cat) {
    if (cat === 'Paint') return 'Walls (Paint)';
    if (cat === 'Casegoods') return 'Case Goods';
    if (cat === 'Carpet' || cat === 'Vinyl Flooring') return 'Carpet + Flooring';
    if (cat === 'Fixtures & Equipment' || cat === 'Lighting') return 'Fixtures & Lighting';
    if (cat === 'Softgoods') return 'Seating';
    if (cat === 'Bedding') return 'Bedding';
    return null; // categories outside the curated 6 (Artwork, Base, Tile, etc.) are not part of this rollup
  }

  const bucketTotals = {};
  const bucketSkus = {};       // bucket -> [{name, sku, kg, hasData, vendor, cat}]
  let grandTotal = 0;
  let outsideBucketTotal = 0;

  Object.keys(bySku).forEach(sku => {
    const allRows = bySku[sku];
    const cat = allRows[0].SPEC_CATEGORY;
    const name = allRows[0].PRODUCT_NAME;
    const bucket = toPriorityBucket(cat);
    if (!bucket) {
      const options = allRows.filter(r => toNum(r.WEIGHTED_RATE_KG_PER_UNIT) !== null && !isExcludedRow(r));
      if (options.length > 0) {
        options.sort((a, b) => combinedTotal(a) - combinedTotal(b));
        const kg = combinedTotal(options[0]);
        grandTotal += kg;
        outsideBucketTotal += kg;
      }
      return;
    }

    const options = allRows.filter(r => toNum(r.WEIGHTED_RATE_KG_PER_UNIT) !== null && !isExcludedRow(r));
    if (!bucketSkus[bucket]) bucketSkus[bucket] = [];

    if (options.length === 0) {
      // No usable data for this product -- still shown, marked clearly, not dropped
      bucketSkus[bucket].push({ name, sku, cat, kg: 0, hasData: false, vendor: null });
      return;
    }
    options.sort((a, b) => combinedTotal(a) - combinedTotal(b));
    const kg = combinedTotal(options[0]);
    const vendor = options[0].VENDOR_NAME;
    const factoriesUsed = toNum(options[0].FACTORIES_USED_IN_AVERAGE);
    grandTotal += kg;
    bucketTotals[bucket] = (bucketTotals[bucket] || 0) + kg;
    bucketSkus[bucket].push({ name, sku, cat, kg, hasData: true, vendor, factoriesUsed });
  });

  const bucketEntries = Object.entries(bucketTotals).sort((a, b) => b[1] - a[1]);

  function pct(n, d) { return d > 0 ? (n / d * 100) : 0; }

  let skuRowCounter = 0;

  const rowsHtml = bucketEntries.map(([bucket, kg], i) => {
    const p = pct(kg, grandTotal);
    const allSkus = bucketSkus[bucket] || [];
    const missingSkus = allSkus.filter(s => !s.hasData);
    const skus = allSkus.slice().sort((a, b) => (b.hasData - a.hasData) || (b.kg - a.kg));
    const skuRows = skus.map(s => {
      if (!s.hasData) {
        return `<tr><td>${s.name}</td><td>&mdash;</td><td>${displayCat(s.cat)}</td><td><span class="opt-badge nodata">No usable data</span></td><td></td></tr>`;
      }
      skuRowCounter++;
      const rowId = 'pc-sku-' + skuRowCounter;
      const facKey = s.sku + '|' + s.vendor;
      const allFacilities = facilityLookup[facKey] || [];
      const facilitiesAnnotated = allFacilities.map(f => ({
        ...f,
        usable: f.TOTAL_EMISSIONS !== '-' && f.TOTAL_EMISSIONS !== '' && f.TOTAL_UNITS !== '-' && f.TOTAL_UNITS !== ''
      })).sort((a, b) => (b.usable - a.usable));
      const usedCount = facilitiesAnnotated.filter(f => f.usable).length;

      const facRowsHtml = facilitiesAnnotated.map(f => {
        return `<tr>
          <td class="wrap">${f.FACILITY_NAME}</td>
          <td class="wrap">${f.FACILITY_LOCATION || '&mdash;'}</td>
          <td>${f.usable ? '<span class="opt-badge best">Used in rate</span>' : '<span class="opt-badge nodata">Not used &mdash; incomplete data</span>'}</td>
          <td>${f.usable ? Number(f.TOTAL_EMISSIONS).toLocaleString() + ' kg' : '&mdash;'}</td>
          <td>${f.usable ? Number(f.TOTAL_UNITS).toLocaleString() : '&mdash;'}</td>
        </tr>`;
      }).join('');
      const facDetailHtml = `
        <tr id="${rowId}-detail" style="display:none;">
          <td colspan="5" style="padding-left:24px; background:var(--surface-0);">
            <div style="font-size:11px; color:var(--text-muted); margin:6px 0 4px;">
              ${usedCount} of ${allFacilities.length} facilities on record for ${s.vendor} for this specific product actually contributed to the rate shown above (production-volume-weighted where more than one applies). The rest are shown for transparency but excluded &mdash; typically because their footprint status says "Completed" but a units or emissions figure is still missing.
            </div>
            <table class="opt-table">
              <thead><tr><th>Facility</th><th>Location</th><th>Status</th><th>Facility annual emissions</th><th>Facility annual units</th></tr></thead>
              <tbody>${facRowsHtml || '<tr><td colspan="5" style="color:var(--text-muted);">No facility detail found</td></tr>'}</tbody>
            </table>
          </td>
        </tr>
      `;

      return `<tr class="sku-toggle-row" data-toggle="${rowId}-detail" style="cursor:pointer;">
          <td>${s.name}</td>
          <td>${s.vendor} <span style="color:var(--text-muted); font-size:11px;">(${usedCount} of ${allFacilities.length} facilities used &#9662;)</span></td>
          <td>${displayCat(s.cat)}</td>
          <td>${s.kg.toFixed(2)} kg</td>
          <td></td>
        </tr>${facDetailHtml}`;
    }).join('');
    const missingListHtml = missingSkus.length
      ? `<div style="font-size:11px; color:#9c3b3b; margin-top:2px;">Missing data: ${missingSkus.map(s => s.name).join(', ')}</div>`
      : '';
    return `
      <div class="cat-row" data-cat-idx="${i}">
        <div class="cat-row-main">
          <span class="rank">${i + 1}</span>
          <span class="name">${bucket}${missingSkus.length ? ' <span class="opt-badge nodata" style="margin-left:6px;">data gap</span>' : ''}${missingListHtml}</span>
          <div class="cat-stack-track"><div class="a3" style="width:100%"></div></div>
          <span class="cat-value">${kg.toFixed(2)} kg</span>
          <span class="cat-pct">${p.toFixed(1)}%</span>
          <span class="cat-chevron">&#9654;</span>
        </div>
        <div class="cat-detail">
          <table class="opt-table">
            <thead><tr><th>Product</th><th>Vendor</th><th>Category</th><th>Best Case (kg)</th><th></th></tr></thead>
            <tbody>${skuRows || '<tr><td colspan="5" style="color:var(--text-muted);">No products in this bucket</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join('');

  panel.innerHTML =
    '<p class="tabindex">Tab ' + (tabIndex + 1) + ' of 6</p>' +
    '<p class="tabname">Priority Categories</p>' +
    '<p class="tabdesc">' + tabs[tabIndex].d + '</p>' +
    '<div class="legend-row"><span style="color:var(--text-muted);">Click a category to see the products behind it; click a product to see the individual factories behind its rate. Percentages reflect the data currently available, not the full room.</span></div>' +
    rowsHtml +
    (outsideBucketTotal > 0
      ? `<p class="sd-footnote" style="margin-top:14px;">Categories outside this curated rollup (Artwork, Base, Corner Guard, etc.) contribute an additional ${outsideBucketTotal.toFixed(2)} kg not shown here &mdash; see the Results tab for the full 16-category breakdown.</p>`
      : '') +
    tabs[tabIndex].html;

  panel.querySelectorAll('.cat-row').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.cat-detail')) return;
      el.classList.toggle('expanded');
    });
  });

  panel.querySelectorAll('.sku-toggle-row').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const targetId = el.getAttribute('data-toggle');
      const detailRow = document.getElementById(targetId);
      if (detailRow) {
        detailRow.style.display = detailRow.style.display === 'none' ? '' : 'none';
      }
    });
  });
}

function renderResultsTab(tabIndex) {
  const rows = A3_A4_DATA;
  const scenarioLabelMap = { best: 'Best Case', baseline: 'Baseline' };

  // Group by SKU -- keep ALL rows including excluded ones, so excluded
  // vendors still show up in the detail view (just not counted in totals)
  const bySku = {};
  rows.forEach(r => {
    if (!bySku[r.SKU_NUMBER]) bySku[r.SKU_NUMBER] = [];
    bySku[r.SKU_NUMBER].push(r);
  });

  function isExcludedRow(r) {
    return A4_EXCLUDED_OUTLIERS.has(r.SKU_NUMBER + '|' + r.VENDOR_NAME);
  }

  // Area: one value per SKU (averaged across vendor options, since area is a
  // room-space attribute, not a vendor attribute -- summing every vendor row
  // would double/triple count the same physical space)
  const skuArea = {};
  Object.keys(bySku).forEach(sku => {
    const areas = bySku[sku].map(r => toNum(r.TOTAL_AREA)).filter(a => a !== null);
    skuArea[sku] = areas.length ? areas.reduce((s, a) => s + a, 0) / areas.length : 0;
  });
  const totalRoomArea = Object.values(skuArea).reduce((s, a) => s + a, 0);
  const catArea = {};        // category -> total sq ft

  let bestA3 = 0, bestA4 = 0, baselineA3 = 0, baselineA4 = 0;
  const catBest = {};        // category -> {a3, a4}
  const catSkus = {};        // category -> [{sku, name, options: [...]}]
  let skusWithNoData = 0;
  let coveredArea = 0;
  const totalSkus = Object.keys(bySku).length;

  Object.keys(bySku).forEach(sku => {
    const allRows = bySku[sku];
    const options = allRows.filter(r => toNum(r.WEIGHTED_RATE_KG_PER_UNIT) !== null && !isExcludedRow(r));
    const cat = allRows[0].SPEC_CATEGORY;
    const name = allRows[0].PRODUCT_NAME;

    catArea[cat] = (catArea[cat] || 0) + skuArea[sku];

    if (!catSkus[cat]) catSkus[cat] = [];

    if (options.length === 0) {
      skusWithNoData++;
      catSkus[cat].push({ sku, name, options: allRows, bestVendor: null, baselineVendor: null });
      return;
    }
    // options here is already filtered to non-null, non-excluded rows --
    // so reaching this point means the SKU has reliable data, safe to count
    // toward area coverage
    coveredArea += skuArea[sku];
    options.sort((a, b) => combinedTotal(a) - combinedTotal(b));
    const best = options[0];
    const baseline = options[options.length - 1];

    const bA3 = toNum(best.A3_MANUFACTURING_KG_CO2E) || 0;
    const bA4 = toNum(best.A4_DISTRIBUTION_KG_CO2E) || 0;
    const lA3 = toNum(baseline.A3_MANUFACTURING_KG_CO2E) || 0;
    const lA4 = toNum(baseline.A4_DISTRIBUTION_KG_CO2E) || 0;

    bestA3 += bA3; bestA4 += bA4;
    baselineA3 += lA3; baselineA4 += lA4;

    if (!catBest[cat]) catBest[cat] = { a3: 0, a4: 0 };
    catBest[cat].a3 += bA3;
    catBest[cat].a4 += bA4;

    catSkus[cat].push({ sku, name, options: allRows, bestVendor: best.VENDOR_NAME, baselineVendor: baseline.VENDOR_NAME });
  });

  const bestTotal = bestA3 + bestA4;
  const baselineTotal = baselineA3 + baselineA4;
  const reductionPct = baselineTotal > 0 ? Math.round((baselineTotal - bestTotal) / baselineTotal * 100 * 10) / 10 : 0;
  const areaCoveragePct = totalRoomArea > 0 ? (coveredArea / totalRoomArea * 100) : 0;

  // Build from catArea (populated for EVERY category) rather than catBest
  // (only populated for categories with usable data) -- so categories with
  // zero carbon data still show up, flagged, instead of silently vanishing
  const catEntries = Object.keys(catArea).map(cat => {
    const v = catBest[cat] || { a3: 0, a4: 0 };
    return [cat, v.a3 + v.a4, v.a3, v.a4, catArea[cat] || 0];
  });
  catEntries.sort((a, b) => b[1] - a[1]);
  const catGrandTotal = catEntries.reduce((s, e) => s + e[1], 0);
  const catMax = catEntries.length ? catEntries[0][1] : 1;

  function pct(n, d) { return d > 0 ? (n / d * 100) : 0; }

  const areaBannerHtml = `
    <div style="background:#eef7f1; border-radius:10px; padding:16px 20px; margin-bottom:16px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;">
      <span style="font-size:28px; font-weight:700; color:#003E32;">${areaCoveragePct.toFixed(1)}%</span>
      <span style="font-size:13px; color:var(--text-secondary);">
        <strong>Area Coverage:</strong> ${coveredArea.toFixed(1)} of ${totalRoomArea.toFixed(1)} sq ft covered by categories with embodied carbon data
      </span>
    </div>
  `;

  const cardsHtml = `
    <div style="text-align:center;"><div class="reduction-badge">&darr; ${reductionPct}% potential reduction</div></div>
    <div class="results-cards">
      <div class="result-card best">
        <p class="label">Best Case</p>
        <p class="value">${bestTotal.toFixed(1)}</p>
        <p class="unit">kg CO2e per guest room</p>
        <div class="stackbar">
          <div class="a3" style="width:${pct(bestA3,bestTotal)}%"></div>
          <div class="a4" style="width:${pct(bestA4,bestTotal)}%"></div>
        </div>
        <div class="splitrow">
          <div><div class="num a3">${bestA3.toFixed(1)}</div><div class="lbl">Manufacturing</div></div>
          <div><div class="num a4">${bestA4.toFixed(1)}</div><div class="lbl">Distribution</div></div>
        </div>
      </div>
      <div class="result-card baseline">
        <p class="label">Baseline</p>
        <p class="value">${baselineTotal.toFixed(1)}</p>
        <p class="unit">kg CO2e per guest room</p>
        <div class="stackbar">
          <div class="a3" style="width:${pct(baselineA3,baselineTotal)}%"></div>
          <div class="a4" style="width:${pct(baselineA4,baselineTotal)}%"></div>
        </div>
        <div class="splitrow">
          <div><div class="num a3">${baselineA3.toFixed(1)}</div><div class="lbl">Manufacturing</div></div>
          <div><div class="num a4">${baselineA4.toFixed(1)}</div><div class="lbl">Distribution</div></div>
        </div>
      </div>
    </div>
    <div class="legend-row">
      <span><span class="swatch" style="background:#006F62;"></span>A3 Manufacturing</span>
      <span><span class="swatch" style="background:#98B6E4;"></span>A4 Distribution</span>
      <span style="color:var(--text-muted);">Click a category to see the SKUs and vendor options behind it</span>
    </div>
  `;

  function badgeFor(sku, thisRowVendor, hasData, excluded) {
    if (excluded) return '<span class="opt-badge excluded">Excluded &mdash; unreliable rate</span>';
    if (!hasData) return '<span class="opt-badge nodata">No Data</span>';
    const skuOptions = bySku[sku].filter(r => toNum(r.WEIGHTED_RATE_KG_PER_UNIT) !== null && !isExcludedRow(r));
    if (skuOptions.length === 1) return '<span class="opt-badge only">Only Option</span>';
    skuOptions.sort((a,b)=>combinedTotal(a)-combinedTotal(b));
    if (thisRowVendor === skuOptions[0].VENDOR_NAME) return '<span class="opt-badge best">Best Case</span>';
    if (thisRowVendor === skuOptions[skuOptions.length-1].VENDOR_NAME) return '<span class="opt-badge baseline">Baseline</span>';
    return '<span class="opt-badge other">Other Option</span>';
  }

  const facilityLookupResults = {};
  SKU_FACILITY_DATA.forEach(r => {
    const key = r.SKU_NUMBER + '|' + r.VENDOR_NAME;
    if (!facilityLookupResults[key]) facilityLookupResults[key] = [];
    facilityLookupResults[key].push(r);
  });
  let resultsRowCounter = 0;

  const catRowsHtml = catEntries.map(([cat, total, a3, a4, area], i) => {
    const p = pct(total, catGrandTotal);
    const areaP = pct(area, totalRoomArea);
    const skuList = catSkus[cat] || [];
    const detailHtml = skuList.map(s => {
      const rowsHtml = s.options.map(o => {
        const hasData = toNum(o.WEIGHTED_RATE_KG_PER_UNIT) !== null;
        const a3v = toNum(o.A3_MANUFACTURING_KG_CO2E);
        const a4v = toNum(o.A4_DISTRIBUTION_KG_CO2E);
        const totalv = (a3v || 0) + (a4v || 0);
        const excluded = isExcludedRow(o);

        let facToggleHtml = '';
        let facDetailRow = '';
        if (hasData) {
          const facKey = o.SKU_NUMBER + '|' + o.VENDOR_NAME;
          const facs = (facilityLookupResults[facKey] || []).map(f => ({
            ...f,
            usable: f.TOTAL_EMISSIONS !== '-' && f.TOTAL_EMISSIONS !== '' && f.TOTAL_UNITS !== '-' && f.TOTAL_UNITS !== ''
          })).sort((a, b) => (b.usable - a.usable));
          const usedN = facs.filter(f => f.usable).length;
          resultsRowCounter++;
          const rid = 'res-fac-' + resultsRowCounter;
          facToggleHtml = ` <span class="fac-toggle" data-toggle="${rid}" style="cursor:pointer; color:var(--text-muted); font-size:11px;">(${usedN} of ${facs.length} facilities &#9662;)</span>`;
          const facRows = facs.map(f => `<tr>
            <td class="wrap">${f.FACILITY_NAME}</td>
            <td class="wrap">${f.FACILITY_LOCATION || '&mdash;'}</td>
            <td>${f.usable ? '<span class="opt-badge best">Used in rate</span>' : '<span class="opt-badge nodata">Not used</span>'}</td>
            <td>${f.usable ? Number(f.TOTAL_EMISSIONS).toLocaleString() + ' kg' : '&mdash;'}</td>
            <td>${f.usable ? Number(f.TOTAL_UNITS).toLocaleString() : '&mdash;'}</td>
          </tr>`).join('');
          facDetailRow = `<tr id="${rid}" style="display:none;"><td colspan="6" style="padding-left:24px; background:var(--surface-0);">
            <table class="opt-table"><thead><tr><th>Facility</th><th>Location</th><th>Status</th><th>Annual emissions</th><th>Annual units</th></tr></thead>
            <tbody>${facRows || '<tr><td colspan="5" style="color:var(--text-muted);">No facility detail found</td></tr>'}</tbody></table>
          </td></tr>`;
        }

        return `<tr>
          <td>${o.VENDOR_NAME}${facToggleHtml}</td>
          <td>${badgeForStatus(o.MSAP_AFFILIATED)}</td>
          <td>${badgeFor(s.sku, o.VENDOR_NAME, hasData, excluded)}</td>
          <td>${hasData && a3v !== null ? a3v.toFixed(2) : '&mdash;'}</td>
          <td>${hasData && a4v !== null ? a4v.toFixed(2) : '&mdash;'}</td>
          <td><strong>${hasData ? totalv.toFixed(2) + ' kg' : '&mdash;'}</strong></td>
        </tr>${facDetailRow}`;
      }).join('');
      const verifyNote = s.sku === 'EXG2-CPT-01'
        ? `<div style="font-size:11px; color:#b5602b; margin:4px 0;">Flagged for source verification: Encore's rate here is notably lower than Mohawk's for the same product &mdash; worth confirming the underlying facility data before relying on this as Best Case.</div>`
        : '';
      return `
        <div class="sku-block">
          <div class="sku-title">${s.name} <span style="color:var(--text-muted); font-weight:400;">(${s.sku})</span></div>
          ${verifyNote}
          <table class="opt-table">
            <thead><tr><th>Vendor</th><th>Program status</th><th>Scenario</th><th>Manufacturing (kg)</th><th>Distribution (kg)</th><th>Total (kg)</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
    }).join('');

    const hasAnyData = total > 0;

    return `
      <div class="cat-row" data-cat-idx="${i}">
        <div class="cat-row-main">
          <span class="rank">${i + 1}</span>
          <span class="name">${displayCat(cat)}<br><span style="font-size:11px; color:var(--text-muted); font-weight:400;">${area.toFixed(1)} sq ft (${areaP.toFixed(1)}% of room)</span></span>
          ${hasAnyData ? `
          <div class="cat-stack-track">
            <div class="a3" style="width:${pct(a3,total)}%"></div>
            <div class="a4" style="width:${pct(a4,total)}%"></div>
          </div>
          <span class="cat-value">${total.toFixed(1)} kg</span>
          <span class="cat-pct">${p.toFixed(1)}%</span>
          ` : `
          <div class="cat-stack-track" style="background:#f4e6e6;"></div>
          <span class="cat-value" style="color:#B5602B;">No carbon data</span>
          <span class="cat-pct">&mdash;</span>
          `}
          <span class="cat-chevron">&#9654;</span>
        </div>
        <div class="cat-detail">${detailHtml}</div>
      </div>
    `;
  }).join('');

      (totalSkus - skusWithNoData) + ' of ' + totalSkus + ' SKUs with usable vendor data.</p>' +
    cardsHtml +
    areaBannerHtml +
    '<h3 style="font-size:13px; font-weight:500; color:var(--text-primary); margin:20px 0 8px;">Category contribution (Best Case) &mdash; all 16 categories in this room</h3>' +
    catRowsHtml +
    '<h3 style="font-size:13px; font-weight:500; color:var(--text-primary); margin:24px 0 8px;">King guest room</h3>' +
    floorplanHtml +
    tabs[tabIndex].html;

  panel.querySelectorAll('.cat-row').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.cat-detail')) return; // don't collapse when clicking inside detail
      el.classList.toggle('expanded');
    });
  });

  panel.querySelectorAll('.fac-toggle').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const target = document.getElementById(el.getAttribute('data-toggle'));
      if (target) target.style.display = target.style.display === 'none' ? '' : 'none';
    });
  });
}

function renderProgramCoverageTab(tabIndex) {
  const rows = SOURCE_DATA;

  // "Usable" means both emissions AND units are actually present -- the
  // footprint status label alone isn't enough. A facility can show
  // "Footprint Completed" and still be missing one of the two numbers
  // needed to calculate a rate (e.g. Kohler Tangier - MA01 has units but no
  // emissions; Kohler Texas - DT has emissions but no units).
  function isUsable(r) {
    return toNum(r.TOTAL_EMISSIONS) !== null && toNum(r.TOTAL_UNITS) !== null;
  }

  // Roll up to vendor level
  const vendorMap = {};
  rows.forEach(r => {
    const v = r.VENDOR_NAME;
    if (!vendorMap[v]) {
      vendorMap[v] = {
        vendor: v,
        status: r.MSAP_AFFILIATED,
        facilities: new Set(),
        facilitiesWithData: new Set()
      };
    }
    // "Not Rated" is a placeholder for "no facility on record," not a real
    // facility -- counting it would make a Not Affiliated vendor with zero
    // real facilities show up as having 1
    if (r.FACILITY_NAME !== 'Not Rated') {
      vendorMap[v].facilities.add(r.FACILITY_NAME);
    }
    if (isUsable(r)) {
      vendorMap[v].facilitiesWithData.add(r.FACILITY_NAME);
    }
  });

  const vendorRollup = Object.values(vendorMap).map(v => ({
    vendor: v.vendor,
    status: v.status,
    facilityCount: v.facilities.size,
    facilitiesWithDataCount: v.facilitiesWithData.size
  })).sort((a, b) => a.vendor.localeCompare(b.vendor));

  const totalVendors = vendorRollup.length;
  // Includes both Active and Historical -- these vendors are still "in
  // Mindclick's program" and we have data from them, regardless of whether
  // they're currently participating
  const vendorsInProgram = vendorRollup.filter(v => v.status === 'Active' || v.status === 'Historical').length;
  const vendorsWithAnyData = vendorRollup.filter(v => v.facilitiesWithDataCount > 0).length;
  const totalFacilities = vendorRollup.reduce((sum, v) => sum + v.facilityCount, 0);
  const totalFacilitiesWithData = vendorRollup.reduce((sum, v) => sum + v.facilitiesWithDataCount, 0);

  const statsHtml =
    '<div class="sd-stats">' +
      '<div class="sd-stat" style="--sd-accent:#003E32;"><div class="num">' + totalVendors + '</div><div class="label">vendors in this room\'s BOM</div></div>' +
      '<div class="sd-stat" style="--sd-accent:#98B6E4;"><div class="num">' + Math.round(100 * vendorsInProgram / totalVendors) + '%</div><div class="label">of vendors with current or historical data in Mindclick\'s program</div></div>' +
      '<div class="sd-stat" style="--sd-accent:#003E32;"><div class="num">' + totalFacilities + '</div><div class="label">total facilities across those vendors</div></div>' +
      '<div class="sd-stat" style="--sd-accent:#98B6E4;"><div class="num">' + Math.round(100 * vendorsWithAnyData / totalVendors) + '%</div><div class="label">of vendors in the BOM with usable data</div></div>' +
      '<div class="sd-stat" style="--sd-accent:#98B6E4;"><div class="num">' + Math.round(100 * totalFacilitiesWithData / totalFacilities) + '%</div><div class="label">of facilities for vendors in Mindclick\'s program with usable data</div></div>' +
    '</div>';

  const tableHtml =
    '<div class="sd-table-wrap"><div class="sd-table-scroll">' +
    '<table class="sd-table"><thead><tr>' +
      '<th>Vendor</th><th>Program status</th><th># Facilities</th><th># With data</th><th>% Coverage</th>' +
    '</tr></thead><tbody>' +
    vendorRollup.map(v => {
      const pct = v.facilityCount > 0 ? Math.round(100 * v.facilitiesWithDataCount / v.facilityCount) : 0;
      return '<tr>' +
        '<td class="wrap">' + v.vendor + '</td>' +
        '<td>' + badgeForStatus(v.status) + '</td>' +
        '<td>' + v.facilityCount + '</td>' +
        '<td>' + v.facilitiesWithDataCount + '</td>' +
        '<td>' + pct + '%</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table>' +
    '</div></div>';

  panel.innerHTML =
    '<p class="tabindex">Tab ' + (tabIndex + 1) + ' of 6</p>' +
    '<p class="tabname">Program coverage</p>' +
    '<p class="tabdesc">How much of the vendor and factory universe this room\'s BOM covers, rolled up from source data.</p>' +
    statsHtml +
    tableHtml +
    tabs[tabIndex].html;
}

function render(i) {
  bar.querySelectorAll('button').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
  });
  if (tabs[i].isTable) {
    renderSourceDataTab();
    return;
  }
  if (tabs[i].isProgramCoverage) {
    renderProgramCoverageTab(i);
    return;
  }
  if (tabs[i].isResults) {
    renderResultsTab(i);
    return;
  }
  if (tabs[i].isPriorityCategories) {
    renderPriorityCategoriesTab(i);
    return;
  }
  panel.innerHTML =
    '<p class="tabindex">Tab ' + (i + 1) + ' of 6</p>' +
    '<p class="tabname">' + tabs[i].n + '</p>' +
    '<p class="tabdesc">' + tabs[i].d + '</p>' +
    tabs[i].html;
}

tabs.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = t.n;
  b.onclick = () => render(i);
  bar.appendChild(b);
});

render(0);
</script>
</body>
</html>
